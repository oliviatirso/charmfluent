<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gallery – Charmfluent</title>
  <meta name="description" content="Browse the Charmfluent gallery — custom grillz and tooth gem work, all handcrafted.">
  <meta property="og:title" content="Gallery – Charmfluent">
  <meta property="og:description" content="Browse the Charmfluent gallery — custom grillz and tooth gem work, all handcrafted.">
  <meta property="og:image" content="/assets/og-image.png">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Gallery – Charmfluent">
  <meta name="twitter:description" content="Browse the Charmfluent gallery — custom grillz and tooth gem work, all handcrafted.">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <link rel="stylesheet" href="/src/pages/camera.css">
</head>
<body>

  <div id="vignette"></div>
  <a href="#" id="back-btn">← Back</a>

  <!-- Main photo viewer -->
  <div id="gallery">
    <button class="gallery-arrow" id="arrow-left">&#8249;</button>

    <div id="photo-column">
      <!-- Category filter pills above photo -->
      <div id="filter-bar">
        <button class="filter-pill active" data-cat="all">All</button>
        <button class="filter-pill" data-cat="grills">Grillz</button>
        <button class="filter-pill" data-cat="gems">Tooth Gems</button>
      </div>
      <div id="photo-wrap">
        <img id="main-photo" alt="Charmfluent custom grillz and tooth gem work">
      </div>
    </div>

    <button class="gallery-arrow" id="arrow-right">&#8250;</button>
  </div>

  <!-- Filmstrip -->
  <div id="filmstrip"></div>

  <!-- Counter -->
  <div id="photo-counter"></div>


  <input type="file" id="file-input" accept="image/*" multiple>

  <footer id="footer">© Charmfluent Studios. All Rights Reserved.</footer>

  <script type="module" src="/src/pages/camera.js"></script>
</body>
</html>
